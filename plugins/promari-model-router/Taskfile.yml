# Task runner (go-task, pinned in tools/go.mod): tools/run.sh task <name>
version: "3"

vars:
  GO: '{{.GO | default "go"}}'
  # Every tool goes through tools/run.sh, which finds the modfile that pins it (tools/go.mod for
  # the checks, tools/release for syft and cosign, tools/dev for developer-only tools, and one
  # modfile per tool whose dependencies conflict) and prefers CI's prebuilt release binaries.
  TOOL: 'GO={{.GO}} sh tools/run.sh'

env:
  GOTOOLCHAIN: '{{.GOTOOLCHAIN | default "auto"}}'
  CGO_ENABLED: "0"

tasks:
  default:
    desc: The checks, for local use
    cmds: [task: generate-check, task: lint, task: test, task: eval, task: security]

  ci:
    desc: Everything CI runs, in one pass (the tests run once, with the race detector and coverage)
    cmds:
      - task: generate-check
      - task: lint
      - task: coverage
        vars: { RACE: -race }
      - task: eval
      - task: security
      - task: build
      - task: actionlint

  generate:
    desc: Regenerate the HTTP server from openapi/openapi.yaml
    cmds: ['{{.TOOL}} oapi-codegen -config openapi/oapi-codegen.yaml openapi/openapi.yaml']

  generate-check:
    desc: Fail if generated code is stale
    cmds:
      - task: generate
      - git diff --exit-code -- internal/interfaces/web/api

  fmt:
    desc: Format (gofumpt + gci through golangci-lint)
    cmds: ['{{.TOOL}} golangci-lint fmt ./...']

  lint:
    desc: golangci-lint v2, go vet, deadcode, editorconfig, embedded agent tiers
    cmds:
      - '{{.GO}} vet ./...'
      - '{{.TOOL}} golangci-lint run ./...'
      - '{{.TOOL}} deadcode -test ./...'
      - '{{.TOOL}} editorconfig-checker'
      - '{{.GO}} run ./cmd/pmr lint'

  test:
    desc: Unit, table-driven and runn E2E tests with coverage
    # -race needs cgo on linux (not on darwin), so the global CGO_ENABLED=0 would fail only in CI.
    env:
      CGO_ENABLED: "1"
    cmds: ['{{.GO}} test -race -coverprofile=coverage.out -covermode=atomic ./...']

  fuzz:
    desc: Fuzz the read-only SQL guard (property test)
    cmds: ['{{.GO}} test -run=^$ -fuzz=FuzzValidateQueryNeverAcceptsWrites -fuzztime={{.FUZZTIME | default "30s"}} ./internal/infrastructure/persistence/']

  coverage:
    desc: Coverage of unit tests and the E2E binary together (covdata), reported and gated by octocov
    env:
      PMR_E2E_COVERDIR: '{{.ROOT_DIR}}/.cover'
      # RACE=-race adds the race detector, which needs cgo on linux and counts in atomic mode;
      # GOFLAGS makes the E2E binary the tests build count in the same mode, or covdata cannot merge them.
      CGO_ENABLED: '{{if .RACE}}1{{else}}0{{end}}'
      GOFLAGS: '{{if .RACE}}-covermode=atomic{{end}}'
    cmds:
      - rm -rf .cover && mkdir -p .cover
      - '{{.GO}} test {{.RACE}} -cover -coverpkg=./... ./... -args -test.gocoverdir={{.ROOT_DIR}}/.cover'
      # Excluded, with the reason (everything else must be 100%):
      #   api.gen.go   generated by oapi-codegen from openapi/openapi.yaml
      # cmd/pmr is counted: the E2E runbooks run the instrumented binary, and a
      # -cover binary writes its counters on os.Exit as well.
      - '{{.GO}} tool covdata textfmt -i=.cover -o coverage.all.out'
      - grep -v -e '/api.gen.go:' coverage.all.out > coverage.out
      - '{{.TOOL}} octocov'

  eval:
    desc: Evaluation gate on the embedded labelled set (thresholds in data/defaults.toml [eval])
    cmds: ['{{.GO}} run ./cmd/pmr eval']

  bench:
    desc: Benchmarks compared with benchstat (BASE=old.txt)
    cmds:
      - '{{.GO}} test -run=^$ -bench=. -count=10 ./... | tee bench.txt'
      - '{{if .BASE}}{{.TOOL}} benchstat {{.BASE}} bench.txt{{end}}'

  security:
    desc: Known vulnerabilities (govulncheck, osv-scanner) and secrets (gitleaks)
    cmds:
      - '{{.TOOL}} govulncheck ./...'
      - '{{.TOOL}} osv-scanner scan source -L go.mod'
      - '{{.TOOL}} gitleaks dir . --no-banner --redact'

  train:
    desc: Retrain the embedded (synthetic) artifact — routing never uses it; see the textbook
    cmds: ['{{.GO}} run ./cmd/pmr train --output data/artifact.json']

  build:
    desc: Snapshot build of every release target into dist/
    cmds: ['{{.TOOL}} goreleaser build --snapshot --clean']

  build-release:
    desc: 'Snapshot build of the given release targets only (TARGETS=linux_amd64 is required)'
    cmds: ['sh tools/build-release.sh "{{.TARGETS}}" --snapshot']

  sbom:
    # The released binaries, not the source tree: syft reads the dependency list Go embeds in each
    # binary. Scanning dir:. made syft run `go list -deps -test all` for the plugin and every pinned
    # tool module under tools/, which downloaded ~12 GB and filled the release runner's disk.
    desc: Software bill of materials of the binaries in dist/ (syft, SPDX JSON; run after a build)
    cmds: ['{{.TOOL}} syft dir:dist --source-name pmr -o spdx-json=sbom.spdx.json']

  actionlint:
    desc: Lint the GitHub Actions workflows of the repository that hosts this plugin
    cmds: ['{{.TOOL}} actionlint {{.WORKFLOWS | default "../../../.github/workflows/*claude-plugin*.yml"}}']
