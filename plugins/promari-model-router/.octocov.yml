# Coverage report (k1LoW/octocov, pinned in tools/octocov/go.mod).
coverage:
  paths: [coverage.out]
  # Every statement outside the documented exclusions (Taskfile.yml `coverage`) is tested.
  acceptable: 100%
codeToTestRatio:
  code: ["**/*.go", "!**/*_test.go", "!internal/interfaces/web/api/api.gen.go"]
  test: ["**/*_test.go"]
testExecutionTime:
  if: false
report:
  if: false
