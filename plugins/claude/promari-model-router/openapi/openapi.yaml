openapi: 3.0.3
info:
  title: promari-model-router local API
  version: 1.0.0
  description: |
    Read-only API served by `pmr serve` on the loopback interface. It exposes the
    routing ledger and the routing explanation for dashboards and scripts. It never
    writes the ledger, changes settings, or reaches the network. A request whose
    Host header is not a loopback name (127.0.0.1, localhost, [::1]) is answered
    with 421 Misdirected Request (DNS rebinding guard).
servers:
  - url: http://127.0.0.1:7457
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness check
      responses:
        "200":
          description: The server is up.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Health"}
  /v1/report:
    get:
      operationId: getReport
      summary: Summarise the routing ledger
      parameters:
        - name: days
          in: query
          required: false
          schema: {type: number, format: double, minimum: 0.01, maximum: 366, default: 7}
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Report"}
        "400":
          description: Invalid parameters.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /v1/explain:
    post:
      operationId: postExplain
      summary: Explain how a brief would be classified and routed
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ExplainRequest"}
      responses:
        "200":
          description: The explanation.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Explanation"}
        "400":
          description: Invalid request.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /v1/events:
    get:
      operationId: getEvents
      summary: Stream new ledger entries as Server-Sent Events
      parameters:
        - name: since_seconds
          in: query
          required: false
          schema: {type: integer, minimum: 0, maximum: 86400, default: 0}
      responses:
        "200":
          description: An SSE stream; each event's data is a LedgerEvent.
          content:
            text/event-stream:
              schema: {type: string}
        "400":
          description: since_seconds is not an integer within range.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
components:
  schemas:
    Health:
      type: object
      required: [status, version]
      properties:
        status: {type: string, enum: [ok]}
        version: {type: string}
    Error:
      type: object
      required: [message]
      properties:
        message: {type: string}
    ExplainRequest:
      type: object
      required: [prompt]
      additionalProperties: false
      properties:
        prompt: {type: string, minLength: 1, maxLength: 200000}
        subagent_type: {type: string, default: general-purpose, maxLength: 200}
        session_model: {type: string, default: claude-opus-5-5, maxLength: 200}
    Explanation:
      type: object
      description: Classification, the routing decision, and the per-stage trace.
      additionalProperties: true
      required: [subagent_decision, trace]
      properties:
        class: {type: string}
        confidence: {type: integer}
        margin: {type: integer}
        danger: {type: boolean}
        lang: {type: string}
        chars: {type: integer}
        advice: {type: string}
        subagent_decision:
          type: object
          additionalProperties: true
          required: [action, reason]
          properties:
            action: {type: string, enum: [none, inject, shadow, ask, skip]}
            reason: {type: string}
            target: {type: string}
        trace:
          type: object
          additionalProperties: true
          properties:
            path: {type: array, items: {type: string}}
    Report:
      type: object
      description: Ledger summary; every rate comes with its denominator.
      additionalProperties: true
      required: [entries, prompts, subagents, results, errors]
      properties:
        entries: {type: integer}
        errors: {type: integer}
        prompts: {type: object, additionalProperties: true}
        subagents: {type: object, additionalProperties: true}
        results: {type: object, additionalProperties: true}
    LedgerEvent:
      type: object
      additionalProperties: true
      required: [at, event]
      properties:
        at: {type: string, format: date-time}
        event: {type: string}
        action: {type: string}
        reason: {type: string}
        target: {type: string}
        class: {type: string}
