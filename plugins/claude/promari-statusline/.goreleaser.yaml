# GoReleaser v2 (pinned in tools/go.mod). The release workflow runs
# tools/build-release.sh, which builds dist/psl_<os>_<arch> for the chosen targets.
version: 2
project_name: psl

before:
  hooks:
    - go mod download

builds:
  - id: psl
    main: ./cmd/psl
    # dist/psl_<os>_<arch>[.exe] is the name bin/psl looks for.
    binary: '{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}'
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w -X promari-statusline/internal/interfaces/cli.Version={{.Version}}
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    no_unique_dist_dir: true

sboms:
  - artifacts: binary
    cmd: sh
    args: ["tools/run.sh", "syft", "$artifact", "--output", "spdx-json=$document"]

checksum:
  name_template: checksums.txt
