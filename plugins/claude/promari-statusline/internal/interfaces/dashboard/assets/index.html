<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Promari | Session Dashboard</title>
    <meta
      name="description"
      content="制限、費用、トークン、作業、品質、環境。セッションの主要指標を一画面で把握し、必要な指標の詳細へ。"
    />
    <link rel="stylesheet" href="app.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23202633'/%3E%3Cpath d='M8 24V8h9a5 5 0 010 10h-9' fill='none' stroke='%239dc1b4' stroke-width='3'/%3E%3C/svg%3E"
    />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">ダッシュボードへ移動</a>
    <header class="masthead">
      <a href="#overview" class="brand" aria-label="Promari ダッシュボード"
        ><span class="brand-mark">P<span>↗</span></span
        ><span>PROMARI<small>SESSION OBSERVATORY</small></span></a
      >
      <nav class="breadcrumb" aria-label="現在の画面">
        <a href="#overview">Dashboard</a><span>/</span
        ><span id="breadcrumb-current">Overview</span>
      </nav>
      <div class="controls">
        <p id="status" class="status" data-state="connecting" role="status">
          <span class="status-dot"></span><span id="status-text">接続中</span>
        </p>
        <label class="range"
          ><span aria-hidden="true">◷</span
          ><select id="range" aria-label="グラフの表示期間">
            <option value="15">過去15分</option>
            <option value="60" selected>過去1時間</option>
            <option value="180">過去3時間</option>
          </select></label
        >
        <button
          id="refresh"
          class="button icon-button"
          type="button"
          aria-label="今すぐ更新"
          title="今すぐ更新"
        >
          ↻
        </button>
        <button id="pause" class="button" type="button" aria-pressed="false">
          Ⅱ 一時停止
        </button>
        <button
          id="fullscreen"
          class="button icon-button"
          type="button"
          aria-label="全画面表示"
          title="全画面表示"
        >
          ⛶
        </button>
      </div>
    </header>
    <main id="main">
      <section
        id="overview-page"
        class="overview-page"
        aria-labelledby="page-title"
      >
        <div class="page-heading">
          <div class="heading-title">
            <span class="eyebrow">YOUR WORK, IN FOCUS.</span>
            <h1 id="page-title">Session dashboard<span>.</span></h1>
          </div>
        </div>
        <div class="overview-status">
          <p id="freshness" class="freshness">読み取り専用 · 5秒ごとに更新</p>
          <a class="all-link" href="#detail/research"
            >研究に基づく指標 ↗</a
          >
          <a class="all-link" href="#detail/all"
            >全指標を詳しく見る <span>↗</span></a
          >
        </div>
        <section id="summary" class="summary" aria-label="主要な指標"></section>
        <section
          id="overview"
          class="overview"
          aria-label="全体を把握するダッシュボード"
        ></section>
        <nav
          id="category-strip"
          class="category-strip"
          aria-label="すべての分類の状態と詳細"
        ></nav>
      </section>
      <section
        id="detail-page"
        class="detail-page"
        hidden
        aria-labelledby="detail-title"
      >
        <div class="detail-heading">
          <div>
            <a href="#overview" class="back-link">← ダッシュボードへ</a>
            <h1 id="detail-title" tabindex="-1">指標の詳細</h1>
            <p id="detail-description"></p>
          </div>
          <div class="detail-filters">
            <label class="search"
              ><span aria-hidden="true">⌕</span
              ><input
                id="search"
                type="search"
                placeholder="指標・値を検索"
                aria-label="詳細の指標・値を検索" /></label
            ><button
              id="alerts-only"
              class="button"
              type="button"
              aria-pressed="false"
            >
              警告のみ
            </button>
          </div>
        </div>
        <p id="detail-freshness" class="detail-freshness"></p>
        <section
          id="detail-charts"
          class="detail-charts"
          aria-label="履歴の詳細"
        ></section>
        <div id="board" class="board"></div>
      </section>
    </main>
    <footer>
      <span
        ><i class="local-dot"></i> LOCAL ONLY
        <span class="footer-separator">/</span> 読み取り専用
        <span class="footer-separator">/</span>
        <span id="version">psl</span></span
      ><span id="updated">更新待ち</span>
    </footer>
  </body>
</html>
