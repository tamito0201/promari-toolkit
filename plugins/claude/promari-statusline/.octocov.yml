# Coverage report (k1LoW/octocov, pinned in tools/octocov/go.mod).
coverage:
  paths: [coverage.out]
  # Set to what the tests reach (see Taskfile.yml `coverage`); it only moves up.
  acceptable: 100%
codeToTestRatio:
  code: ["**/*.go", "!**/*_test.go"]
  test: ["**/*_test.go"]
testExecutionTime:
  if: false
report:
  if: false
