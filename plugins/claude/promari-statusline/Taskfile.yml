# Task runner (go-task, pinned in tools/go.mod): tools/run.sh task <name>
version: "3"

vars:
  GO: '{{.GO | default "go"}}'
  # Every tool goes through tools/run.sh, which finds the modfile that pins it (tools/go.mod for
  # the checks, tools/release for syft and cosign, and one modfile per tool whose dependencies
  # conflict) and prefers CI's prebuilt release binaries.
  TOOL: 'GO={{.GO}} sh tools/run.sh'

env:
  GOTOOLCHAIN: '{{.GOTOOLCHAIN | default "auto"}}'
  CGO_ENABLED: "0"

tasks:
  default:
    desc: The checks, for local use
    cmds: [task: lint, task: test, task: launcher-test, task: security]

  ci:
    desc: 'Everything CI runs, in one pass (the tests run twice, side by side: once with the race detector, once for coverage)'
    # Order: the file scan before anything writes dist/ or .cover/, then the independent checks side
    # by side, then the scans that read every file (gitleaks) once the outputs exist.
    cmds:
      - task: lint-files
      - task: ci-parallel
      - task: security
      - task: actionlint

  ci-parallel:
    desc: The independent checks of ci, side by side
    internal: true
    # None reads what another writes: the tests write .cover/ and build the E2E binary in a temporary
    # directory, goreleaser writes dist/, the linters only read the sources.
    deps:
      - task: lint-code
      - task: race
      - task: launcher-test
      - task: coverage
      - task: build

  # CI runs the lint checks as three jobs, each with its own runner (see _claude-plugin.yml).
  ci-lint-golangci:
    desc: go vet, go fix and golangci-lint (a CI job of its own)
    cmds:
      - '{{.GO}} vet ./...'
      - task: modern
      - '{{.TOOL}} golangci-lint run ./...'

  ci-lint-deadcode:
    desc: deadcode, a whole-program analysis (a CI job of its own)
    cmds: ['{{.TOOL}} deadcode -test ./...']

  ci-lint-misc:
    desc: 'The light checks: editorconfig, the launcher, vulnerabilities, secrets, workflows (a CI job of its own)'
    cmds:
      - task: lint-files
      - task: launcher-test
      - task: security
      - task: actionlint

  race:
    desc: The tests with the race detector (no coverage; see coverage)
    # -race needs cgo on linux (not on darwin), so the global CGO_ENABLED=0 would fail only in CI.
    env:
      CGO_ENABLED: "1"
    cmds:
      # With GOTEST_REPORT set (CI), every test event also goes to that file as JSON (each test's
      # duration, for the CI dashboard); the log still shows go test's usual output.
      - |
        {{if .GOTEST_REPORT}}set -o pipefail
        {{.GO}} test -race -json ./... | tee "{{.GOTEST_REPORT}}" | jq -rj 'select(.Action == "output") | .Output'{{else}}{{.GO}} test -race ./...{{end}}

  launcher-test:
    desc: How bin/psl provides a binary (release download, Go build, checksum mismatch, hook), with fake go and curl
    cmds: ['sh tools/test-launcher.sh']

  fmt:
    desc: Format (gofumpt + gci through golangci-lint)
    cmds: ['{{.TOOL}} golangci-lint fmt ./...']

  modern:
    desc: Fail when go fix would change anything (an old spelling of something the Go version in go.mod writes better)
    cmds:
      - |
        diff=$({{.GO}} fix -diff ./... 2>&1) || { echo "$diff"; exit 1; }
        [ -z "$diff" ] || { echo "$diff"; echo "❌ go fix has changes: run 'go fix ./...'" >&2; exit 1; }

  lint:
    desc: golangci-lint v2, go vet, go fix, deadcode, editorconfig
    cmds: [task: lint-code, task: lint-files]

  lint-code:
    desc: go vet, go fix, golangci-lint v2, deadcode (read the sources only)
    cmds:
      - '{{.GO}} vet ./...'
      - task: modern
      - '{{.TOOL}} golangci-lint run ./...'
      - '{{.TOOL}} deadcode -test ./...'

  lint-files:
    desc: editorconfig (reads every file, so ci runs it before anything writes dist/ or .cover/)
    cmds: ['{{.TOOL}} editorconfig-checker']

  test:
    desc: Unit tests and the E2E tests of the built binary, with the race detector
    # -race needs cgo on linux (not on darwin), so the global CGO_ENABLED=0 would fail only in CI.
    env:
      CGO_ENABLED: "1"
    cmds: ['{{.GO}} test -race ./...']

  coverage:
    desc: Coverage of the unit tests and the E2E binary together (covdata), reported and gated by octocov
    env:
      PSL_E2E_COVERDIR: '{{.ROOT_DIR}}/.cover'
      # set mode: the race detector would silently switch coverage to atomic (go help testflag), and
      # the E2E binary must count in the same mode or covdata cannot merge them.
      GOFLAGS: '-covermode=set'
    cmds:
      - rm -rf .cover && mkdir -p .cover
      - '{{.GO}} test -cover -coverpkg=./... ./... -args -test.gocoverdir={{.ROOT_DIR}}/.cover'
      # cmd/psl is counted: the E2E tests run the instrumented binary, and a -cover binary writes its
      # counters on os.Exit as well.
      - '{{.GO}} tool covdata textfmt -i=.cover -o coverage.out'
      # octocov checks `coverage.acceptable` only when CI is set: without it, it prints the numbers
      # and exits 0 (cmd/root.go: `if os.Getenv("CI") == "" { return printMetrics(cmd) }`), so a
      # local run passed at 99.7% while CI failed. Run it in CI mode everywhere; its CI mode also
      # needs a repository name, which only names the report here (nothing is posted).
      - 'CI="${CI:-true}" GITHUB_REPOSITORY="${GITHUB_REPOSITORY:-local/promari-statusline}" {{.TOOL}} octocov'

  security:
    desc: Known vulnerabilities (govulncheck, osv-scanner) and secrets (gitleaks)
    cmds:
      - '{{.TOOL}} govulncheck ./...'
      - '{{.TOOL}} osv-scanner scan source -L go.mod'
      - '{{.TOOL}} gitleaks dir . --no-banner --redact'

  build:
    desc: Snapshot build of every release target into dist/
    cmds: ['{{.TOOL}} goreleaser build --snapshot --clean']

  build-release:
    desc: 'Snapshot build of the given release targets only (TARGETS=linux_amd64 is required)'
    cmds: ['sh tools/build-release.sh "{{.TARGETS}}" --snapshot']

  sbom:
    # The released binaries, not the source tree: syft reads the dependency list Go embeds in each
    # binary. Scanning dir:. would make syft run `go list -deps -test all` for the plugin and every
    # pinned tool module under tools/, which downloads gigabytes and fills the release runner's disk.
    desc: Software bill of materials of the binaries in dist/ (syft, SPDX JSON; run after a build)
    cmds: ['{{.TOOL}} syft dir:dist --source-name psl -o spdx-json=sbom.spdx.json']

  actionlint:
    desc: Lint the GitHub Actions workflows of the repository that hosts this plugin
    cmds: ['{{.TOOL}} actionlint {{.WORKFLOWS | default "../../../../.github/workflows/*claude-plugin*.yml"}}']
