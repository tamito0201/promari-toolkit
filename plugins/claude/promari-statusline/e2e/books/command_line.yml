desc: サブコマンドの終了コードと出力先（テーブル駆動）
vars:
  # 各行: 引数 / 終了コード / 標準出力に含む語 / 標準エラーに含む語
  cases:
    - { args: "version",    exit: 0, stdout: "psl ",   stderr: "" }
    - { args: "help",       exit: 0, stdout: "Usage:", stderr: "" }
    - { args: "",           exit: 2, stdout: "",       stderr: "Usage:" }
    - { args: "frobnicate", exit: 2, stdout: "",       stderr: "unknown command" }
steps:
  run:
    desc: 各行を実行して結果を集める（判定は次のステップで全行まとめて行う）
    loop:
      count: len(vars.cases)
    exec:
      command: "{{ vars.env }} {{ vars.psl }} {{ vars.cases[i].args }}"
    bind:
      'results[]': |
        {
          "args": vars.cases[i].args,
          "exit": current.exit_code,
          "stdout": current.stdout contains vars.cases[i].stdout,
          "stderr": current.stderr contains vars.cases[i].stderr
        }
  check:
    test: 'compare(results, map(vars.cases, {{"args": .args, "exit": .exit, "stdout": true, "stderr": true}}))'
