desc: 診断→試行→導入→再診断→再導入→hook→削除の一連が、利用者の設定を壊さずに往復する
vars:
  settings: '{"tui":"fullscreen","statusLine":{"type":"command","command":"~/.claude/statusline.sh"},"z":1}'
  # psl が書く形（2スペースのインデント・末尾改行）。Go の書き方ではない。
  installed: |
    {
      "tui": "fullscreen",
      "statusLine": {
        "type": "command",
        "command": "~/.claude/promari-statusline/psl render",
        "padding": 0,
        "refreshInterval": 5
      },
      "z": 1
    }
steps:
  prepare:
    exec:
      command: "mkdir -p {{ vars.home }}/.claude && printf '%s' '{{ vars.settings }}' > {{ vars.home }}/.claude/settings.json"
    test: current.exit_code == 0
  doctor_before:
    exec:
      command: "{{ vars.env }} {{ vars.psl }} doctor"
    test: |
      compare(
        {"exit": current.exit_code, "other": current.stdout contains "statusLine runs another command", "missing": current.stdout contains "not installed"},
        {"exit": 1, "other": true, "missing": true}
      )
  dry_run:
    exec:
      command: "{{ vars.env }} {{ vars.psl }} setup --dry-run"
    test: |
      compare(
        {
          "exit": current.exit_code,
          "plan": current.stdout contains "would set statusLine",
          "settings": file(vars.home + "/.claude/settings.json"),
          "binary": file(vars.home + "/.claude/promari-statusline/psl") == nil
        },
        {"exit": 0, "plan": true, "settings": vars.settings, "binary": true}
      )
  setup:
    exec:
      command: "{{ vars.env }} {{ vars.psl }} setup"
    test: |
      compare(
        {"exit": current.exit_code, "previous": current.stdout contains "previous command: ~/.claude/statusline.sh", "settings": file(vars.home + "/.claude/settings.json")},
        {"exit": 0, "previous": true, "settings": vars.installed}
      )
  backup:
    desc: 導入前の設定がそのまま1つだけ退避されている
    exec:
      command: "ls {{ vars.home }}/.claude/settings.json.bak-* | wc -l | tr -d ' ' && cat {{ vars.home }}/.claude/settings.json.bak-*"
    test: 'compare(current.stdout, "1\n" + vars.settings)'
  installed_copy:
    desc: Claude Code が実行するのは写した実行可能ファイル
    exec:
      command: "test -x {{ vars.home }}/.claude/promari-statusline/psl && {{ vars.env }} {{ vars.home }}/.claude/promari-statusline/psl version"
    test: 'compare({"exit": current.exit_code, "version": current.stdout startsWith "psl "}, {"exit": 0, "version": true})'
  doctor_after:
    exec:
      command: "{{ vars.env }} {{ vars.psl }} doctor"
    test: 'compare({"exit": current.exit_code, "running": current.stdout contains "is the running binary"}, {"exit": 0, "running": true})'
  setup_again:
    exec:
      command: "{{ vars.env }} {{ vars.psl }} setup"
    test: 'compare({"exit": current.exit_code, "unchanged": current.stdout contains "settings unchanged"}, {"exit": 0, "unchanged": true})'
  hook:
    exec:
      command: "{{ vars.env }} {{ vars.psl }} hook SessionStart"
      stdin: "{}"
    test: 'compare({"exit": current.exit_code, "stdout": current.stdout, "stderr": current.stderr}, {"exit": 0, "stdout": "", "stderr": ""})'
  uninstall:
    exec:
      command: "{{ vars.env }} {{ vars.psl }} uninstall"
    test: |
      compare(
        {
          "exit": current.exit_code,
          "removed": current.stdout contains "removed statusLine",
          "statusLine": file(vars.home + "/.claude/settings.json") contains "statusLine",
          "kept": file(vars.home + "/.claude/settings.json") contains '"tui": "fullscreen"',
          "binary": file(vars.home + "/.claude/promari-statusline/psl") == nil
        },
        {"exit": 0, "removed": true, "statusLine": false, "kept": true, "binary": true}
      )
