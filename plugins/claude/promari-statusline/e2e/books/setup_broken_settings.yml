desc: 壊れた settings.json には触らず、終了コード1で理由を告げる
vars:
  broken: '{"tui": "fullscreen",}'
steps:
  prepare:
    exec:
      command: "mkdir -p {{ vars.home }}/.claude && printf '%s' '{{ vars.broken }}' > {{ vars.home }}/.claude/settings.json"
    test: current.exit_code == 0
  setup:
    exec:
      command: "{{ vars.env }} {{ vars.psl }} setup"
    test: |
      compare(
        {"exit": current.exit_code, "reason": current.stderr contains "not a JSON object, left untouched", "settings": file(vars.home + "/.claude/settings.json")},
        {"exit": 1, "reason": true, "settings": vars.broken}
      )
