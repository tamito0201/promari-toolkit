desc: |
  2026-10-05 の画面の再現。66桁の端末で Claude Code はステータスラインを2セル字下げし、
  最終桁に触れる行を切るので、表示できるのは63セル。その画面と同じ形の報告が、どの行も63セル以内に収まる。
vars:
  # 各行: 狭い幅でも残るべきチップ
  chips:
    - "██░░░░░░░░ 19% 187k/1.00M 残 813k"
    - "⚡ Claude 5h ░░░░░ 8%"
    - "7d ████░ 88%"
    - "Pace ×1.5"
    - "Sess $4.41"
    - "Parallel ×0.30"
    - "📦 Cache│Hit 85% TTL 1h 残 59m│Save 76%│🧊 Cold 187k│Write 162k"
    - "Last new 2 wr 2k rd 185k → out 201"
steps:
  render:
    exec:
      command: "{{ vars.env }} COLUMNS=66 {{ vars.psl }} render"
      stdin: |
        {"session_id":"replay","prompt_id":"p1","version":"2.1.289",
        "model":{"display_name":"Fable 5"},"effort":{"level":"high"},"thinking":{"enabled":true},
        "context_window":{"context_window_size":1000000,"used_percentage":18.7,"total_output_tokens":201,
        "current_usage":{"input_tokens":2,"cache_creation_input_tokens":2000,"cache_read_input_tokens":185000}},
        "cost":{"total_cost_usd":4.41,"total_duration_ms":300000,"total_api_duration_ms":90000},
        "prompt_cache":{"hit_ratio":0.85,"ttl":"1h","expires_at":{{ now().Unix() + 3570 }},"recache_tokens_if_cold":187000,"cache_write_tokens":162000,"warm":true,"caching_observed":true},
        "rate_limits":{"five_hour":{"used_percentage":8,"resets_at":{{ now().Unix() + 15810 }}},"seven_day":{"used_percentage":88,"resets_at":{{ now().Unix() + 246000 }}}}}
    test: |
      compare(
        {"exit": current.exit_code, "stderr": current.stderr, "fits": widest(current.stdout) <= 63, "width": file(vars.home + "/.cache/promari-statusline/width.txt")},
        {"exit": 0, "stderr": "", "fits": true, "width": "COLUMNS 63\n"}
      )
  chips:
    desc: 表の全行を1回の compare で確かめる（runn のステップループは最後の回の test しか判定しないため使わない）
    test: |
      compare(
        fromPairs(map(vars.chips, {[#, plain(steps.render.stdout) contains #]})),
        fromPairs(map(vars.chips, {[#, true]}))
      )
