desc: ダッシュボードは最後の描画が記録した内容を HTTP で配信し、Ctrl-C で正常終了する
steps:
  render:
    exec:
      command: "{{ vars.env }} COLUMNS=100 {{ vars.psl }} render < {{ vars.testdata }}/report.json"
    test: 'compare({"exit": current.exit_code, "stderr": current.stderr}, {"exit": 0, "stderr": ""})'
  serve:
    desc: 終了コードを後で読めるよう、PID と終了コードをホームに書き出す
    exec:
      command: ( {{ vars.env }} {{ vars.psl }} dashboard --addr 127.0.0.1:{{ vars.port }} > /dev/null 2>&1 & echo $! > {{ vars.home }}/dashboard.pid; wait $!; echo $? > {{ vars.home }}/dashboard.exit )
      background: true
  snapshot:
    loop:
      count: 50
      until: 'current.res?.status == 200' # 起動前は接続できず応答が無い
      minInterval: 100ms
      maxInterval: 100ms
    dashboard:
      /api/snapshot:
        get:
          body: null
    test: |
      compare(
        {
          "model": current.res.body.session.model,
          "contextPct": current.res.body.headline.contextPct,
          "sessionUsd": current.res.body.headline.sessionUsd,
          "fiveHour": current.res.body.headline.fiveHour.usedPct,
          "sevenDay": current.res.body.headline.sevenDay.usedPct,
          "limitsBand": any(current.res.body.bands, {.name == "LIMITS"}),
          "contextGroup": any(current.res.body.groups, {toJSON(#) contains "🧠 Context"})
        },
        {"model": "Opus 5.5", "contextPct": 42, "sessionUsd": 1.23, "fiveHour": 1, "sevenDay": 73, "limitsBand": true, "contextGroup": true}
      )
  page:
    dashboard:
      /:
        get:
          body: null
    test: 'compare({"status": current.res.status, "script": current.res.rawBody contains "app.js"}, {"status": 200, "script": true})'
  stop:
    exec:
      command: kill -INT "$(cat {{ vars.home }}/dashboard.pid)"
    test: current.exit_code == 0
  exited:
    desc: Ctrl-C（SIGINT）で終了コード0
    loop:
      count: 50
      until: 'current.exit_code == 0' # 終了してファイルが書かれるまで待つ
      minInterval: 100ms
      maxInterval: 100ms
    exec:
      command: cat {{ vars.home }}/dashboard.exit
    test: 'compare(current.stdout, "0\n")'
