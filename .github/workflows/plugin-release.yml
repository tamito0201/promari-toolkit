name: Plugin release

# promari-portal publishes a Claude Code plugin here with a deploy key (git push only, no token):
# it pushes the release files to the ref refs/release-assets/<tag>, then the commit to main, then the
# tag <plugin>-v<version>. A deploy key cannot call the API, so this workflow, started by the tag
# push, creates the GitHub Release with this repository's own GITHUB_TOKEN and attaches the files.
#
# refs/release-assets/<tag> is not under refs/heads/, so it is not a branch: GitHub does not list it
# and does not show a "had recent pushes" notice for it. The branch release-assets/<tag>, which
# portal pushed until 1.0.2, is still accepted so that either repository can be updated first.
# Tags with neither (for example promari-sns-share up to 4.2.0, published by hand) are left alone.
on:
  push:
    tags: ["promari-*-v*"]

permissions:
  contents: read

concurrency:
  group: plugin-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release and delete the release-assets ref
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # deletes the release-assets ref at the end
      - name: Fetch the release files pushed with the tag
        id: assets
        run: |
          ref=""
          for candidate in "refs/release-assets/$TAG" "refs/heads/release-assets/$TAG"; do
            set +e
            git ls-remote --exit-code origin "$candidate" >/dev/null
            rc=$?
            set -e
            if [[ $rc == 0 ]]; then ref=$candidate; break; fi
            # 2 means "no such ref"; anything else is a failed lookup, which must not pass as "not found".
            if [[ $rc != 2 ]]; then echo "❌ cannot look up $candidate (git ls-remote exit $rc)" >&2; exit 1; fi
          done
          if [[ -z "$ref" ]]; then
            echo "no release-assets ref for $TAG: not a portal plugin release, nothing to do"
            echo "found=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "release files: $ref"
          git fetch --no-tags --depth 1 origin "$ref"
          mkdir "$RUNNER_TEMP/assets"
          git archive FETCH_HEAD | tar -x -C "$RUNNER_TEMP/assets"
          ls -la "$RUNNER_TEMP/assets"
          { echo "found=true"; echo "ref=$ref"; } >> "$GITHUB_OUTPUT"
      - name: Verify the binaries against checksums.txt
        if: steps.assets.outputs.found == 'true'
        working-directory: ${{ runner.temp }}/assets
        run: |
          sed 's| |  |' checksums.txt | sha256sum --strict -c -
          test -s sbom.spdx.json
          test -s checksums.txt.sigstore.json
          test -s .release-notes.md
      - name: Create the GitHub Release
        if: steps.assets.outputs.found == 'true'
        working-directory: ${{ runner.temp }}/assets
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "❌ the release $TAG already exists (a published version never moves)" >&2; exit 1
          fi
          mapfile -t files < <(find . -maxdepth 1 -type f ! -name .release-notes.md -printf '%f\n' | sort)
          gh release create "$TAG" --repo "$REPO" --verify-tag --title "$TAG" --notes-file .release-notes.md "${files[@]}"
          echo "✅ released $TAG" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Delete the release-assets ref
        if: steps.assets.outputs.found == 'true'
        env:
          ASSETS_REF: ${{ steps.assets.outputs.ref }}
        run: |
          git push origin --delete "$ASSETS_REF"
          # A delete of a ref that does not exist also succeeds, so read it back.
          set +e
          git ls-remote --exit-code origin "$ASSETS_REF" >/dev/null
          rc=$?
          set -e
          [[ $rc == 2 ]] || { echo "❌ $ASSETS_REF is still there (git ls-remote exit $rc)" >&2; exit 1; }
          echo "deleted $ASSETS_REF"
